version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: presente-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      # Sin valor por defecto a proposito: docker compose aborta con este mensaje
      # si la clave no esta en el .env, en vez de arrancar con una clave conocida.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definela en tu archivo .env (ver .env.example)}
      POSTGRES_DB: ${DB_NAME:-presente}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-presente}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presente_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: presente-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?definela en tu archivo .env}@postgres:5432/${DB_NAME:-presente}}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      # URL del frontend que codifica el QR; el backend la exige al arrancar.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # Configuracion de CORS leida por app/config.py
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      ALLOWED_ORIGIN_REGEX: ${ALLOWED_ORIGIN_REGEX:-}
      ENV: ${ENV:-production}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./back/app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - presente_network
    restart: unless-stopped

  # React/Vite Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: presente-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - presente_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  presente_network:
    driver: bridge
