<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presente - Sistema de Asistencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <script>
      // Aplicamos el tema antes de que React renderice para evitar el parpadeo
      // del modo claro al recargar. La misma lógica vive en src/hooks/useTema.js.
      try {
        const tema = localStorage.getItem('tema');
        const oscuro = tema
          ? tema === 'oscuro'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (oscuro) document.documentElement.classList.add('dark');
      } catch (err) {
        // Sin acceso a localStorage: se queda en modo claro.
      }
    </script>
    <script>
      // Cargamos la configuración de runtime que genera entrypoint.sh dentro del
      // contenedor de nginx (sincrónico, antes de que arranque la app).
      // En desarrollo con Vite este archivo no existe: en ese caso no definimos
      // nada y src/config.js resuelve la URL desde VITE_API_BASE_URL.
      // El valor por defecto vive en src/config.js, no aquí, para tener un solo
      // lugar donde se decide a qué backend apunta el frontend.
      try {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', '/config.json', false);
        xhr.send();
        if (xhr.status === 200) {
          window.API_BASE_URL = JSON.parse(xhr.responseText).API_BASE_URL;
        }
      } catch (err) {
        // Sin config.json: es lo normal en desarrollo, config.js se encarga.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
